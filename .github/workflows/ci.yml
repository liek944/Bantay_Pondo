name: CI

on:
  push:
    branches:
      - main
      - 'milestone/*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgeos-dev libproj-dev libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff mypy pytest

      - name: Lint with Ruff
        run: ruff check pipeline api db tests

      - name: Strict Typecheck with Mypy
        run: mypy --strict pipeline api

  test:
    name: Pytest with PostGIS & Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: bantay_pondo
          POSTGRES_USER: bantay
          POSTGRES_PASSWORD: bantay_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bantay -d bantay_pondo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://bantay:bantay_secret@localhost:5432/bantay_pondo
      ASYNC_DATABASE_URL: postgresql+psycopg://bantay:bantay_secret@localhost:5432/bantay_pondo
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgeos-dev libproj-dev libpq-dev postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio anyio httpx

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Ingest baseline boundaries and hazards
        run: |
          python -m pipeline ingest-boundaries
          python -m pipeline ingest-hazards
          gunzip -c tests/fixtures/test_pipeline_seed.sql.gz | PGPASSWORD=bantay_secret psql -h localhost -U bantay -d bantay_pondo -q

      - name: Run Pytest Suite
        run: pytest -v

  build-images:
    name: Build Docker Images
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          tags: bantay-pondo-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Pipeline Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.pipeline
          push: false
          tags: bantay-pondo-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
