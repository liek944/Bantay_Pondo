services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: bantay_pondo_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bantay_pondo}
      POSTGRES_USER: ${POSTGRES_USER:-bantay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bantay_secret}
    volumes:
      - bantay_pondo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bantay} -d ${POSTGRES_DB:-bantay_pondo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bantay_pondo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bantay_pondo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bantay_pondo_pg_data:
  bantay_pondo_redis_data:
