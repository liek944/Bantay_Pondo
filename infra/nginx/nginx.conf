user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured JSON log format
    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.mapbox-vector-tile;

    # Rate Limiting: 60 req/min per IP for the API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    # Upstream API service
    upstream api_service {
        server api:8000;
        keepalive 32;
    }

    # HTTP: Let's Encrypt ACME Challenge + HTTPS Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name bantaypondo.ph www.bantaypondo.ph;

        # Let's Encrypt ACME challenge directory
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Health check bypass for load balancer / container orchestrator
        location /healthz {
            proxy_pass http://api_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: Production API & Tile Services
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name bantaypondo.ph www.bantaypondo.ph;

        # Let's Encrypt Certificates
        ssl_certificate /etc/letsencrypt/live/bantaypondo.ph/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bantaypondo.ph/privkey.pem;

        # Modern SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy header defaults
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Vector Tiles Endpoint: UNCAPPED per SPEC ("uncapped for tiles")
        location /v1/tiles/ {
            proxy_pass http://api_service;
            proxy_buffering on;
            proxy_buffers 16 64k;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
            add_header X-RateLimit-Policy "uncapped";
        }

        # API Endpoints: RATE LIMITED to 60 req/min per IP per SPEC
        location /v1/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://api_service;
            add_header X-RateLimit-Policy "60 req/min";
        }

        # Prometheus Metrics Scraping Endpoint
        location /metrics {
            # Internal / prometheus scraping
            proxy_pass http://api_service;
        }

        # Liveness and Readiness Probes
        location /healthz {
            proxy_pass http://api_service;
        }

        location /readyz {
            proxy_pass http://api_service;
        }

        # OpenAPI Documentation and Fallback
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service;
        }
    }
}
