services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: bantay_pondo_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bantay_pondo}
      POSTGRES_USER: ${POSTGRES_USER:-bantay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bantay_prod_secret}
    volumes:
      - bantay_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bantay} -d ${POSTGRES_DB:-bantay_pondo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bantay_net

  redis:
    image: redis:7-alpine
    container_name: bantay_pondo_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-bantay_redis_secret}
    volumes:
      - bantay_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bantay_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bantay_net

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: bantay-pondo-api:latest
    container_name: bantay_pondo_prod_api
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bantay}:${POSTGRES_PASSWORD:-bantay_prod_secret}@db:5432/${POSTGRES_DB:-bantay_pondo}
      ASYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bantay}:${POSTGRES_PASSWORD:-bantay_prod_secret}@db:5432/${POSTGRES_DB:-bantay_pondo}
      REDIS_URL: redis://:${REDIS_PASSWORD:-bantay_redis_secret}@redis:6379/0
      DATA_VERSION: ${DATA_VERSION:-2026.09.21.01}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bantay_net

  nginx:
    image: nginx:1.27-alpine
    container_name: bantay_pondo_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bantay_net

  certbot:
    image: certbot/certbot:latest
    container_name: bantay_pondo_prod_certbot
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    networks:
      - bantay_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bantay_pondo_prod_prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bantay_prod_prom_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bantay_net

volumes:
  bantay_prod_pg_data:
  bantay_prod_redis_data:
  certbot_www:
  certbot_conf:
  nginx_logs:
  bantay_prod_prom_data:

networks:
  bantay_net:
    driver: bridge
